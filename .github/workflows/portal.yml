name: Portal CI/CD

on:
  pull_request:
    paths:
      - "apps/portal/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portal.yml"
      - "deploy/portal/**"
      - "deploy/edge/**"
  push:
    branches: [main]
    paths:
      - "apps/portal/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portal.yml"
      - "deploy/portal/**"
      - "deploy/edge/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/portal-portal
  MIGRATE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/portal-portal-migrate

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal-ci-password
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal -d portal"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PORTAL_DATABASE_URL: postgresql://portal:portal-ci-password@localhost:5432/portal?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-change-me
      BETTER_AUTH_URL: http://localhost:3100
      CALENDAR_URL: http://localhost:3101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile.migrate
          push: true
          tags: ${{ env.MIGRATE_IMAGE_NAME }}:latest,${{ env.MIGRATE_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
