name: Calendar CI/CD

on:
  pull_request:
    paths:
      - "apps/calendar/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/calendar.yml"
      - "deploy/calendar/**"
      - "docker-compose.local.yml"
      - "deploy/edge/**"
  push:
    branches: [main]
    paths:
      - "apps/calendar/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/calendar.yml"
      - "deploy/calendar/**"
      - "docker-compose.local.yml"
      - "deploy/edge/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/portal-calendar
  MIGRATE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/portal-calendar-migrate

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calendar
          POSTGRES_PASSWORD: calendar-ci-password
          POSTGRES_DB: calendar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calendar -d calendar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://calendar:calendar-ci-password@localhost:5432/calendar?schema=public
      PORTAL_DATABASE_URL: postgresql://portal:portal-ci-password@localhost:5433/portal?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-change-me
      BETTER_AUTH_URL: http://localhost:3100
      CALENDAR_URL: http://localhost:3101
      NEXT_PUBLIC_PORTAL_AUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate --schema apps/calendar/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/calendar/prisma/schema.prisma
      - run: npm run calendar:typecheck
      - run: npm run calendar:lint
      - run: npm run calendar:test
      - run: npm run calendar:build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/calendar/Dockerfile.monorepo
          build-args: NEXT_PUBLIC_PORTAL_AUTH_URL=${{ vars.PUBLIC_PORTAL_AUTH_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/calendar/Dockerfile.migrate
          push: true
          tags: ${{ env.MIGRATE_IMAGE_NAME }}:latest,${{ env.MIGRATE_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
