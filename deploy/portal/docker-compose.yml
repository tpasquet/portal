services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PORTAL_POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${PORTAL_POSTGRES_PASSWORD:?set PORTAL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PORTAL_POSTGRES_DB:-portal}
    volumes:
      - portal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [portal-internal]

  migrate:
    image: ${PORTAL_MIGRATE_IMAGE:-ghcr.io/tpasquet/portal-portal-migrate}:${TAG:-latest}
    restart: "no"
    environment:
      PORTAL_DATABASE_URL: ${PORTAL_DATABASE_URL:?set PORTAL_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks: [portal-internal]

  app:
    image: ${PORTAL_IMAGE:-ghcr.io/tpasquet/portal-portal}:${TAG:-latest}
    restart: unless-stopped
    environment:
      PORTAL_DATABASE_URL: ${PORTAL_DATABASE_URL:?set PORTAL_DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      CALENDAR_URL: ${CALENDAR_URL:?set CALENDAR_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      portal-internal:
      edge:
        aliases: [portal-app]

  backup:
    build:
      context: ../backup
    restart: unless-stopped
    environment:
      DATABASE_URL: ${PORTAL_DATABASE_URL:?set PORTAL_DATABASE_URL}
      BACKUP_PREFIX: portal
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - portal_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [portal-internal]

volumes:
  portal_postgres_data:
  portal_backups:

networks:
  portal-internal:
  edge:
    external: true
    name: family-edge
