services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CALENDAR_POSTGRES_USER:-calendar}
      POSTGRES_PASSWORD: ${CALENDAR_POSTGRES_PASSWORD:?set CALENDAR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CALENDAR_POSTGRES_DB:-calendar}
    volumes:
      - calendar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [calendar-internal]

  migrate:
    image: ${CALENDAR_MIGRATE_IMAGE:-ghcr.io/tpasquet/portal-calendar-migrate}:${TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks: [calendar-internal]

  app:
    image: ${CALENDAR_IMAGE:-ghcr.io/tpasquet/portal-calendar}:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PORTAL_DATABASE_URL: ${PORTAL_AUTH_DATABASE_URL:?set PORTAL_AUTH_DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      CALENDAR_URL: ${CALENDAR_URL:?set CALENDAR_URL}
      NEXT_PUBLIC_PORTAL_AUTH_URL: ${NEXT_PUBLIC_PORTAL_AUTH_URL:?set NEXT_PUBLIC_PORTAL_AUTH_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@nomdefamille.fr}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/calendar/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      calendar-internal:
      auth:
      edge:
        aliases: [calendar-app]

  backup:
    build:
      context: ../backup
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BACKUP_PREFIX: calendar
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - calendar_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [calendar-internal]

volumes:
  calendar_postgres_data:
  calendar_backups:

networks:
  calendar-internal:
  auth:
    external: true
    name: family-auth
  edge:
    external: true
    name: family-edge
